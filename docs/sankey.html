<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>응답 흐름도 | 가현챈 XR 설문</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="standalone flow-page">
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<header class="top"><a class="brand" href="index.html">가현챈 <b>XR 설문</b></a><nav aria-label="보고서 메뉴"><a href="index.html">분석 읽기</a><a href="community.html">게시용 코드</a></nav></header>
<main id="main-content" tabindex="-1">
  <header class="companion-intro">
    <h1>응답 흐름도</h1>
    <p>2026년 응답을 콘텐츠, 헤드셋, 그래픽카드와 성능 체감으로 나누어 살펴보세요.</p>
  </header>
<div class="chart-filters">
<label>비교할 항목<select id="diagram"><option value="content" >콘텐츠 변화</option><option value="perception" selected>콘텐츠·GPU·사양 체감</option><option value="perf" >헤드셋·GPU·성능 응답</option><option value="mode" >헤드셋·사용 비중</option></select></label><label>2026 주력 콘텐츠<select id="group"><option>전체</option><option>VRChat</option><option>리듬게임</option><option>FPS·슈팅·액션</option><option>시뮬레이션</option><option>VR MOD</option><option>기타 콘텐츠</option></select></label><label class="check-filter"><input type="checkbox" id="exclude" checked>서로 맞지 않는 회고 응답 제외</label><label id="gpuLimitControl" class="gpu-limit-control">GPU 표시 <select id="gpuLimit"><option value="all" selected>모든 GPU 표시</option><option value="12">상위 12종 + 기타</option><option value="20">상위 20종 + 기타</option></select></label><label class="node-jump-control">항목 찾기 <select id="nodeJump"><option value="">항목 선택…</option></select></label>
</div>
<div class="chart-caption">
  <p id="chartBase" role="status" aria-live="polite"></p>
</div>
<div class="sankey-selection"><div id="selectionInfo" role="status" aria-live="polite">항목이나 연결선을 선택하면 인원과 관련 흐름을 표시합니다.</div><button id="clearSelection" type="button" hidden>선택 해제</button></div>
<div class="chart-view tools" aria-label="그래프 표시 크기"><button id="fit" type="button">폭 맞추기</button><button id="resetView" type="button">글자 크게 보기</button></div>
<div id="chart" role="region" tabindex="0" aria-label="응답 흐름도" aria-describedby="chartHelp"></div>
  <p id="chartContext"></p>
<p class="hint" id="chartHelp">선의 폭은 인원수입니다. 항목을 선택하거나 목록에서 찾으면 연결을 강조합니다. 확대 뒤에는 가로로 스크롤하거나 빈 공간을 드래그하세요. Ctrl+휠로 확대할 수도 있습니다.</p>
<div class="chart-resources">
  <details class="chart-settings"><summary>크기 조절 및 CSV 저장</summary><div class="tools graph-tools"><button id="zoomOut" type="button" aria-label="그래프 축소">−</button><label>크기 <input id="zoom" type="range" min="20" max="200" value="100" step="1" aria-label="그래프 확대율"></label><output id="zoomValue" for="zoom">100%</output><button id="zoomIn" type="button" aria-label="그래프 확대">＋</button><button id="download" type="button" title="현재 필터의 GPU 모델을 합치기 전 연결 건수를 저장합니다">원본 CSV</button></div></details>
  <details><summary>연결표에서 보기</summary><div id="links"></div></details>
  <details><summary>항목별 색상 범례</summary><div id="legend"></div></details>
</div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script src="sankey.js"></script>
</body>
</html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가현챈 Sankey 탐색</title><link rel="stylesheet" href="style.css"><body class="standalone"><header class="top"><a href="index.html">← 분석 읽기</a><strong>Sankey 탐색</strong></header><main><label>흐름<select id="diagram"><option value="content" >콘텐츠 변화</option><option value="perception" selected>콘텐츠·GPU·사양 체감</option><option value="perf" >HMD·GPU·실제 성능</option><option value="mode" >HMD·사용 비중</option></select></label><label>주력 콘텐츠<select id="group"><option>전체</option><option>VRChat</option><option>리듬게임</option><option>FPS·슈팅·액션</option><option>시뮬레이션</option><option>VR MOD</option><option>기타 콘텐츠</option></select></label><label><input type="checkbox" id="exclude" checked>회고 응답 충돌 제외</label><div class="tools graph-tools"><button id="fit" type="button">폭 맞추기</button><button id="zoomOut" type="button" aria-label="그래프 축소">−</button><label>크기 <input id="zoom" type="range" min="20" max="200" value="100" step="5" aria-label="그래프 확대율"></label><output id="zoomValue" for="zoom">100%</output><button id="zoomIn" type="button" aria-label="그래프 확대">＋</button><button id="resetView" type="button">원래 크기</button><button id="download" type="button" title="현재 필터의 개별 원본 링크를 저장합니다">원본 CSV</button></div><label id="gpuLimitControl" class="gpu-limit-control">GPU 표시 <select id="gpuLimit"><option value="all" selected>모든 GPU 표시</option><option value="12">상위 12종 + 기타</option><option value="20">상위 20종 + 기타</option></select></label><label class="node-jump-control">항목 바로 찾기 <select id="nodeJump" aria-label="표시된 Sankey 항목을 찾아 이동"><option value="">항목 선택…</option></select></label><div class="sankey-selection"><div id="selectionInfo" role="status" aria-live="polite">항목이나 연결선을 선택하면 인원과 관련 흐름을 표시합니다.</div><button id="clearSelection" type="button" hidden>선택 해제</button></div><p class="hint">빈 공간 드래그: 이동 · Ctrl+휠: 위치 중심 확대 · 항목·연결선 클릭: 연결 강조 (Alt+드래그로 선 위에서도 이동)</p><div id="chart" tabindex="0" aria-label="Sankey 흐름. 드래그로 이동하고 항목을 선택합니다"></div><details><summary>항목별 색상 범례</summary><div id="legend"></div></details><details><summary>현재 연결표</summary><div id="links"></div></details><p class="hint">GPU는 3DMark Steel Nomad 점수 내림차순, 성능·사양 체감은 높은 순. VR 실성능 순위는 아닙니다.</p></main><script src="data.js"></script><script src="site.js"></script><script src="sankey.js"></script></body></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커뮤니티 게시용 HTML</title><link rel="stylesheet" href="style.css"><body class="standalone"><header class="top"><a href="index.html">← 분석 사이트</a><strong>커뮤니티용 HTML</strong></header><main style="max-width:1050px"><h1>일반 분석만 복사하기</h1><p>기본값은 일반 분석만 포함합니다. HTML/소스 편집 모드에 붙여넣으세요.</p><label><input id="includeDetail" type="checkbox">상세 집계도 포함</label><label>그래프 방식<select id="imageMode"><option value="image">PNG 이미지 + 대화형 링크</option><option value="none">그래프 없이 링크만</option><option value="iframe">대화형 iframe · 허용 게시판만</option></select></label><p class="note">일반 게시판은 script·iframe을 제거할 수 있습니다. PNG 이미지 방식을 권장합니다. 이미지가 차단되면 아래 PNG를 게시판에 직접 업로드하세요.</p><label>사이트 주소<input id="baseUrl" style="width:min(650px,80vw)" type="url"></label><div class="tools"><button id="copyCode">HTML 전체 복사</button><button id="downloadCode">HTML 코드 저장</button></div><p id="status" role="status">불러오는 중…</p><textarea id="pasteCode" aria-label="게시용 HTML 코드" style="width:100%;height:280px;font:12px/1.6 monospace"></textarea><p><a href="assets/content.png" download>콘텐츠 변화 PNG</a> · <a href="assets/perception.png" download>사양 체감 PNG</a> · <a href="assets/mode.png" download>HMD 사용비중 PNG</a></p><details><summary>붙여넣을 내용 미리보기</summary><iframe id="pastePreview" title="게시글 미리보기" sandbox="allow-same-origin" style="width:100%;height:650px;border:1px solid #ccd"></iframe></details></main><script src="community.js"></script></body></html>

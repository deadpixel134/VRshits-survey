<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>게시용 코드 | 가현챈 XR 설문</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="standalone share-page">
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<header class="top"><a class="brand" href="index.html">가현챈 <b>XR 설문</b></a><nav aria-label="보고서 메뉴"><a href="index.html">분석 읽기</a><a href="sankey.html">응답 흐름도</a></nav></header>
<main id="main-content" tabindex="-1">
  <header class="companion-intro">
    <h1>게시판에 설문 결과 올리기</h1>
    <p>공유할 내용과 그래프 형식을 고른 뒤, 코드를 복사해 게시판의 HTML 편집기에 붙여넣으세요.</p>
  </header>
  <div class="share-options">
    <label class="check-filter"><input id="includeDetail" type="checkbox">상세 집계도 포함</label>
    <label>그래프 방식<select id="imageMode"><option value="image">PNG 이미지 + 대화형 링크</option><option value="none">그래프 없이 링크만</option><option value="iframe">대화형 iframe · 허용 게시판만</option></select></label>
    <label>사이트 주소<input id="baseUrl" type="url"></label>
  </div>
  <p class="hint">일반 게시판은 스크립트와 대화형 삽입을 제한할 수 있습니다. PNG 이미지가 차단되면 아래 파일을 내려받아 게시판에 직접 올리세요.</p>
  <div class="tools"><button type="button" id="copyCode">HTML 전체 복사</button><button type="button" id="downloadCode">HTML 코드 저장</button></div>
  <p id="status" role="status">불러오는 중…</p>
  <details class="code-preview"><summary>게시용 HTML 코드 보기</summary><textarea id="pasteCode" aria-label="게시용 HTML 코드"></textarea></details>
  <p class="asset-links"><a href="assets/content.png" download>콘텐츠 변화 PNG</a><a href="assets/perception.png" download>사양 체감 PNG</a><a href="assets/mode.png" download>HMD 사용 비중 PNG</a></p>
  <details class="share-preview"><summary>붙여넣을 내용 미리보기</summary><iframe id="pastePreview" title="게시글 미리보기" sandbox="allow-same-origin"></iframe></details>
</main>
<script src="community.js"></script>
</body>
</html>
